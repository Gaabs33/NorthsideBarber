name: Build extraction helper

on:
  push:
    branches: [main]

jobs:
  helper:
    runs-on: ubuntu-latest
    steps:
      - name: Download UnRAR
        run: |
          curl -L --fail --retry 3             https://github.com/nzbgetcom/unrar/releases/download/v7.23/unrar-x86_64.tar.gz             -o unrar-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: unrar-helper
          path: unrar-x86_64.tar.gz
          retention-days: 1
